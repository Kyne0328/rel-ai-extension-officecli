name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest and package hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          from urllib.parse import urlparse

          root = pathlib.Path(".")
          manifest = json.loads((root / "relai-extension.json").read_text(encoding="utf-8"))

          assert manifest["schemaVersion"] == 1
          assert manifest["id"] == "officecli"
          assert manifest["kind"] == "cli"
          assert manifest["entrypoints"]["skill"] == "SKILL.md"
          assert manifest["entrypoints"]["command"] == "officecli"
          assert "command.execute" in manifest["permissions"]
          assert manifest["repository"] == "https://github.com/Kyne0328/rel-ai-extension-officecli"

          seen_targets = set()
          for artifact in manifest["install"]["artifacts"]:
              assert artifact["platform"] in {"win32", "darwin", "linux"}
              assert artifact["arch"] in {"x64", "arm64"}
              assert urlparse(artifact["url"]).scheme == "https"
              assert re.fullmatch(r"[a-f0-9]{64}", artifact["sha256"])
              target = (artifact["platform"], artifact["arch"])
              assert target not in seen_targets
              seen_targets.add(target)

          for item in manifest["files"]:
              path = root / item["path"]
              assert path.is_file(), f"missing package file: {item['path']}"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == item["sha256"], f"hash mismatch for {item['path']}: {digest}"

          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          assert skill.startswith("---\nname: officecli\n")
          assert "OFFICECLI_SKIP_UPDATE=1" in skill
          assert (root / "agents" / "openai.yaml").is_file()

          print("OfficeCLI extension integrity checks passed.")
          PY
